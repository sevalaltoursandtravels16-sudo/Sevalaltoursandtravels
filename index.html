
<section class="booking-form" id="booking">
  <h2>🚗 Book Your Journey</h2>
  <p>ದಯವಿಟ್ಟು ನಿಮ್ಮ ಪ್ರಯಾಣದ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ.</p>

  <form id="travelBooking">
    <label for="customerName">ನಿಮ್ಮ ಹೆಸರು *</label>
    <input id="customerName" name="customerName"
      required placeholder="ಪೂರ್ಣ ಹೆಸರು">

    <label for="customerPhone">ಮೊಬೈಲ್ ಸಂಖ್ಯೆ *</label>
    <input id="customerPhone" name="customerPhone"
      type="tel" pattern="[0-9]{10}" maxlength="10"
      required placeholder="10 ಅಂಕಿಗಳ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ">

    <label for="pickup">ಎಲ್ಲಿಂದ ಪ್ರಯಾಣ? *</label>
    <input id="pickup" name="pickup"
      required placeholder="ಉದಾ: ಬೆಂಗಳೂರು">

    <label for="destination">ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು? *</label>
    <input id="destination" name="destination"
      required placeholder="ಉದಾ: ಹೊಸದುರ್ಗ">

    <label for="travelDate">ಪ್ರಯಾಣದ ದಿನಾಂಕ *</label>
    <input id="travelDate" name="travelDate"
      type="date" required>

    <label for="travelTime">ಪ್ರಯಾಣದ ಸಮಯ</label>
    <input id="travelTime" name="travelTime" type="time">

    <label for="passengers">ಪ್ರಯಾಣಿಕರ ಸಂಖ್ಯೆ *</label>
    <select id="passengers" name="passengers" required>
      <option value="">ಆಯ್ಕೆ ಮಾಡಿ</option>
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
      <option>7</option>
    </select>

    <label for="vehicle">ವಾಹನ</label>
    <select id="vehicle" name="vehicle">
      <option>Suzuki Ertiga</option>
    </select>

    <label for="extraDetails">ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ</label>
    <textarea id="extraDetails" name="extraDetails"
      rows="3" placeholder="ಇತರೆ ವಿವರಗಳು"></textarea>

    <button type="submit">
      🟢 WhatsApp ಮೂಲಕ ಬುಕ್ ಮಾಡಿ
    </button>
  </form>
</section>

<script>
document.getElementById("travelBooking")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const get = id =>
      document.getElementById(id).value.trim();

    const message =
      "SEVALAL TOURS & TRAVELS - Booking Request\n\n" +
      "ಹೆಸರು: " + get("customerName") + "\n" +
      "ಮೊಬೈಲ್: " + get("customerPhone") + "\n" +
      "ಎಲ್ಲಿಂದ: " + get("pickup") + "\n" +
      "ಎಲ್ಲಿಗೆ: " + get("destination") + "\n" +
      "ದಿನಾಂಕ: " + get("travelDate") + "\n" +
      "ಸಮಯ: " + (get("travelTime") || "ನಿಗದಿಪಡಿಸಿಲ್ಲ") + "\n" +
      "ಪ್ರಯಾಣಿಕರು: " + get("passengers") + "\n" +
      "ವಾಹನ: " + get("vehicle") + "\n" +
      "ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ: " +
      (get("extraDetails") || "ಇಲ್ಲ");

    const whatsappURL =
      "https://wa.me/916361888130?text=" +
      encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
  });
</script>
